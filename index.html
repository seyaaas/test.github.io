
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bertdey na ni gopes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #f5e6d3;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

/* Confetti */
.confetti {
    position: fixed;
    width: 9px;
    height: 13px;
    top: -20px;
    animation: fall linear infinite;
    z-index: 0;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}

/* Paper */
.paper {
    position: relative;
    z-index: 1;
    background: #fff9ed;
    width: 100%;
    max-width: 550px;
    min-height: 700px;
    padding: 50px 35px;
    box-shadow: 0 8px 30px rgba(80, 55, 30, 0.15);
    border: 1px solid #eadcc8;
}

/* Letter design */
h1 {
    text-align: center;
    color: #a97865;
    font-size: 30px;
    margin-bottom: 15px;
}

.subtitle {
    text-align: center;
    color: #c49b85;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.divider {
    text-align: center;
    color: #d6a78e;
    margin-bottom: 30px;
    font-size: 20px;
}

.letter {
    color: #6f5b4e;
    font-size: 16px;
    line-height: 2;
    white-space: pre-line;
}

.signature {
    margin-top: 35px;
    color: #a97865;
    font-style: italic;
    text-align: right;
    font-size: 18px;
}

/* Music button */
.music-button {
    display: block;
    margin: 25px auto 0;
    padding: 12px 25px;
    border: 1px solid #d6a78e;
    border-radius: 30px;
    background: #f5e6d3;
    color: #a97865;
    font-family: Georgia, serif;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.music-button:hover {
    background: #ead5c0;
    transform: scale(1.05);
}

</style>
</head>

<body>

<div class="paper">

    <h1>🎂🥳🎊</h1>

    <p class="subtitle"></p>

    <div class="divider">✧ ───────── ✧</div>

    <div class="letter">
        <h1>Happybirthdayyy gops</h1>
    </div>

    <div class="signature">
    </div>

    <!-- Music Button -->
    <button class="music-button" id="musicButton">
        ▶ Play Music
    </button>

    <!-- Your MP3 -->
    <audio id="birthdaySong" src="song.mp3" preload="auto"></audio>

</div>

<script>
const colors = [
    "#e9a4a4",
    "#e8c477",
    "#a8b99a",
    "#c4a4c9",
    "#e8b8a0",
    "#9bbbc4"
];

for (let i = 0; i < 45; i++) {
    const confetti = document.createElement("div");

    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

    confetti.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    confetti.style.animationDelay =
        (-Math.random() * 10) + "s";

    confetti.style.transform =
        `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(confetti);
}

/* Music controls */
const song = document.getElementById("birthdaySong");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (song.paused) {
        try {
            await song.play();
            musicButton.textContent = "⏸ Pause Music";
        } catch (error) {
            musicButton.textContent = "▶ Play Music";
            alert("Couldn't play the song. Please check song.mp3.");
        }
    } else {
        song.pause();
        musicButton.textContent = "▶ Play Music";
    }

});

song.addEventListener("ended", () => {
    musicButton.textContent = "▶ Play Music";
});
</script>

</body>
</html>
